## Keyboard Identity
CONFIG_ZMK_KEYBOARD_NAME="Charybdis"

## Bluetooth
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BLE=y
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_ZMK_BLE_EXPERIMENTAL_SEC=n
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y
CONFIG_BT_ID_UNPAIR_MATCHING_BONDS=y
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n

## Low Latency Debouncing (1ms press, 5ms release)
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

## HID Features (Full N-Key Rollover)
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y

## Trackball BLE Buffering
CONFIG_BT_CTLR_RX_BUFFERS=9
CONFIG_BT_BUF_EVT_RX_COUNT=16

## Power Management
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_EXT_POWER=y
CONFIG_PM_DEVICE=y

## Battery Level
CONFIG_ZMK_BATTERY_REPORTING=y

## Pointing / Mouse Emulation
CONFIG_ZMK_POINTING=y
CONFIG_INPUT=y

## Behavioral Engine Capacity
CONFIG_ZMK_BEHAVIORS_QUEUE_SIZE=512

## ZMK Studio
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n